name: Publish and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to publish from
        required: true
        type: string
      tag:
        description: Release tag to create or update, for example v1.7.0
        required: true
        type: string

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    # Without this a stalled step burns the full 6h runner limit before anyone
    # notices the release did not publish. A hung apt mirror already cost one
    # release that way. Sized for the worst case of its steps: apt retries, then
    # the unit and e2e suites, both of which run their files serially.
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Configure sandboxing
        timeout-minutes: 15
        run: |
          # Acquire::*::Timeout only guards a single socket operation, so a mirror
          # that stalls once the headers are in never trips it -- that ate a 6h
          # runner limit, then a 5min step cap. Kill each attempt from the outside
          # and retry the fetch instead. No Acquire::Retries: apt retrying inside a
          # killed window would just burn the budget without ever finishing.
          #
          # The per-attempt budgets are generous on purpose. When the image's
          # package lists are stale, a healthy `update` pulls ~5MB of indexes and
          # takes about two minutes; a tighter cap killed it mid-download three
          # times in a row and turned "slow but fine" into a failed release.
          # Languages=none drops the Translation-* files, which nothing here reads.
          apt_opts=(-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Languages=none)
          for attempt in 1 2; do
            if timeout 300 sudo apt-get "${apt_opts[@]}" update \
              && timeout 120 sudo apt-get "${apt_opts[@]}" install --yes bubblewrap; then
              installed=yes
              break
            fi
            echo "apt attempt ${attempt} stalled or failed, retrying"
            sleep 10
          done
          if [ -z "${installed:-}" ]; then
            echo "::error::bubblewrap install failed after 3 attempts"
            exit 1
          fi
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Run e2e tests
        # The suite drives a live model, so a wedged turn hangs instead of
        # failing. Bound it well above the ~3min happy path.
        timeout-minutes: 15
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run test:e2e

  publish-linux-binaries:
    name: Publish Linux release assets
    needs: [verify]
    if: ${{ always() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: npm ci
      - name: Build Linux binary
        run: npm run bundle:linux-x64
      - name: Package Linux binary
        run: npm run package:linux-x64
      - name: Resolve release tag
        id: release-tag
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if [ -z "$tag" ]; then
            echo "::error::No release tag was available for Linux asset upload"
            exit 1
          fi
          ref="${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "$ref" \
              --title "$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Prepare versioned Linux release assets
        run: |
          cp dist/bin/codex-acp-x64-linux.zip "dist/bin/codex-acp-${{ steps.release-tag.outputs.version }}-x64-linux.zip"
      - name: Upload Linux release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.release-tag.outputs.tag }}" \
            "dist/bin/codex-acp-${{ steps.release-tag.outputs.version }}-x64-linux.zip" \
            --clobber
